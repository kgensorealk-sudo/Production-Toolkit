name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: toolkit_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Database authorization regression
        env:
          PGPASSWORD: local-test-password
        run: psql -h localhost -U postgres -X --set=ON_ERROR_STOP=1 --dbname=toolkit_security_test --file=tests/sql/profile-admin-access.sql
